<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AI Governance Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/config.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Step 1: request code -->
      <div id="step-request">
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your email and we'll send you a code</p>
        <div id="request-error" class="error-text hidden"></div>
        <form id="request-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" />
          </div>
          <button type="submit">Send Code</button>
        </form>
      </div>

      <!-- Step 2: verify code -->
      <div id="step-verify" class="hidden">
        <h1>Enter verification code</h1>
        <p class="subtitle">We sent a 6-digit code to your email</p>
        <div id="verify-error" class="error-text hidden"></div>
        <form id="verify-form">
          <div class="field">
            <label for="otp">Verification Code</label>
            <input type="text" id="otp" name="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
          </div>
          <button type="submit">Verify Code</button>
        </form>
      </div>

      <!-- Step 3: new password -->
      <div id="step-reset" class="hidden">
        <h1>Set a new password</h1>
        <p class="subtitle">Choose a new password for your account</p>
        <div id="reset-error" class="error-text hidden"></div>
        <form id="reset-form">
          <div class="field">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" />
          </div>
          <button type="submit">Reset Password</button>
        </form>
      </div>

      <!-- Step 4: done -->
      <div id="step-done" class="hidden">
        <h1>Password reset</h1>
        <p class="success-message">Your password has been changed successfully.</p>
        <div class="auth-links">
          <a href="/login.html">Back to login</a>
        </div>
      </div>

      <div class="auth-links">
        <a href="/login.html">Back to login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>initForgotPasswordPage();</script>
</body>
</html>
