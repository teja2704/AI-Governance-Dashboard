<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — AI Governance Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/config.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Step 1: enter email -->
      <div id="step-email">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to your dashboard</p>

        <div id="login-error" class="error-text hidden"></div>

        <form id="email-form">
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>
          <button type="submit">Continue</button>
        </form>

        <div class="divider">or</div>

        <button type="button" class="btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>
        <p class="google-notice" id="google-notice">Google sign-in is coming soon.</p>

        <div class="auth-links">
          <a href="/forgot-password.html">Forgot password?</a>
          &nbsp;·&nbsp;
          <a href="/signup.html">Create an account</a>
        </div>
      </div>

      <!-- Step 2: enter password -->
      <div id="step-password" class="hidden">
        <button type="button" class="btn-back" id="back-btn">&#8592; Back</button>

        <h1>Enter your password</h1>
        <p class="signing-in-as">Signing in as <strong id="email-display"></strong></p>

        <div id="password-error" class="error-text hidden"></div>

        <form id="password-form">
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
            />
          </div>
          <button type="submit">Sign In</button>
        </form>

        <div class="auth-links">
          <a href="/forgot-password.html">Forgot password?</a>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
